name: Deploy Pelican Site to GitHub Pages

on:
  push:
    branches:
      - master # Change this to your primary tracking branch if it's different

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Static Site
        run: |
          pelican content -s publishconf.py

      - name: Disable GitHub Pages Jekyll processing
        run: |
          touch output/.nojekyll

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages # Deploys static files directly to this target branch

